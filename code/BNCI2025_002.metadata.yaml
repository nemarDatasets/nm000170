  filter_type: Not specified
  highpass_hz: 0.18
  lowpass_hz: 3.0
  notch_hz:
  - 50
  preprocessing_applied: true
  preprocessing_steps:
  - anti-aliasing filter (25 Hz)
  - notch filter (50 Hz)
  - downsampling to 100 Hz
  - bad channel interpolation
  - eye artifact subtraction (SGEYESUB algorithm)
  - removal of frontal (AF) row channels
  - high-pass filter (0.18 Hz)
  - common average re-reference
  - pops and drifts attenuation (HEAR algorithm)
  - low-pass filter (3 Hz)
  - downsampling to 20 Hz
  re_reference: common average reference
runs_per_session: 3
sessions_per_subject: 3
